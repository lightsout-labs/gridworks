name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: make check

  # The end-to-end tests, split over machines of their own: one machine runs
  # them in two workers, which takes several minutes.
  e2e-shard:
    runs-on: ubuntu-latest
    # The browsers and their system libraries come installed, rather than
    # downloaded from mirrors that can stall. The version is the one of
    # @playwright/test in package-lock.json.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0
      options: --user 1001
    # A shard takes a few minutes; a stalled one fails instead of holding the
    # machine for the default six hours.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright test --shard=${{ matrix.shard }}/4

  # The required check, which passes when every shard has passed.
  e2e:
    needs: e2e-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.e2e-shard.result }}" = success

  # Not a required check: a shared CI machine is slower, and varies more,
  # than the laptop the time limits are set for. A failure here asks for a
  # measurement with `make perf` on such a laptop.
  perf:
    runs-on: ubuntu-latest
    # The same image as the end-to-end shards, so Chromium is not downloaded.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The commands of `make perf`: the image has no make.
      - run: npx vitest run --config vitest.perf.config.ts
      - run: npx playwright test --config playwright.perf.config.ts
